services:
  shoppe-next:
    container_name: shoppe-next
    restart: always
    image: node:20.10.0
    ports:
      - 5003:3000
    environment:
      - PORT=3000

    volumes:
      - ./:/usr/src/shoppe-next
    working_dir: /usr/src/shoppe-next

    networks:
      - client-network

      # FOR PRODUCTION
    command: bash -c "yarn && yarn run build && yarn run start"

networks:
  client-network:
    driver: bridge
